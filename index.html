<!DOCTYPE html>
<html lang="ja">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>BLOCKEY</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/button.css" />
  <link rel="stylesheet" href="css/switch.css" />
  
</head>


<body>
  <h6 id="version">ver.--</h6>

  <!-- スタート画面 -->
  <div id="start-screen" class="screen">
    <h1>BLOCKEY</h1>

    <button id="start-button" class="button">START</button>

    
    
    <label class="switch">
        <p id="volume-text">VOLUME：</p>

        <input type="checkbox" id="volume-toggle" checked>
        <span class="slider"></span>
   </label>

  </div>


  <!-- プレイ画面 -->
  <div id="game-screen" class="screen hidden">
    <h1 id="text1">PLAY</h1>

    

    <div id="ex-piece-board"></div>
    <div id="board"></div>

    <button id="return-button" class="button">RETURN HOME</button>

    <button id="undo-button" class="button">←</button>
    <button id="redo-button" class="button">→</button>
    <button id="reset-button" class="button">CLEAR</button>
    <button id="next-button" class="button">>> NEXT >></button>
    
  </div>


  <div id="loading">
     <h1>LOADING...</h1>
  </div>



  
  

  <script type="module" src="main.js"></script>
</body>
</html>
